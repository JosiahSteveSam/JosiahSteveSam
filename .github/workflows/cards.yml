# Rebuilds the contribution snake into profile/ daily, so the README depends on no outside server.
name: cards

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/cards.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=#161616&color_dots=#ebedf0,#FDF7C4,#FBE27A,#FACC00,#C9A400
            profile/snake-dark.svg?color_snake=#FACC00&color_dots=#161b22,#3a3420,#6b5a17,#b39200,#FACC00

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
